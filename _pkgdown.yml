url: https://milkway.github.io/rpic-r/

template:
  bootstrap: 5
  bslib:
    primary: "#2f5d43"

home:
  title: rpic — the pic graphics language in R
  links:
    - text: The rpic language (docs & live examples)
      href: https://rpic.dev
    - text: Engine repository (rpic-lang)
      href: https://github.com/milkway/rpic-lang

reference:
  - title: Compile and export
    desc: >
      Wrap pic source in `pic()` and pipe it into a renderer — SVG, PNG,
      PDF — or into the compile bundle and the scene.
    contents:
      - pic
      - rpic_svg
      - rpic_png
      - rpic_pdf
      - rpic_compile
      - rpic_manifest
      - rpic_scene
  - title: Drawing data
    desc: Objects, named places and warnings of a drawing as data frames.
    contents:
      - rpic_objects
      - rpic_places
      - rpic_warnings
  - title: Maps
    desc: Place a pic drawing on the Earth — GeoJSON, sf, ggplot2 and MapLibre/mapgl maps.
    contents:
      - rpic_geojson
      - rpic_sf
      - rpic_sf_names
      - autoplot.rpic_source
      - rpic_maplibre_layers
      - add_rpic
  - title: knitr
    desc: Inline pic diagrams in R Markdown and Quarto chunks.
    contents:
      - rpic_knitr_engine
      - rpic_register_knitr

news:
  releases:
    - text: rpic 0.12.1
      href: https://github.com/milkway/rpic-r/releases/tag/v0.12.1
    - text: rpic 0.11.3
      href: https://github.com/milkway/rpic-r/releases/tag/v0.11.3
    - text: rpic 0.6.1
      href: https://github.com/milkway/rpic-r/releases/tag/v0.6.1
