name: R-CMD-check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor Rust dependencies
        run: |
          cargo update --manifest-path src/rust/Cargo.toml
          Rscript -e 'install.packages("rextendr")'
          Rscript -e 'rextendr::vendor_crates(".")'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
      - name: Install checkbashisms (top-level files check)
        run: sudo apt-get update && sudo apt-get install -y devscripts
      - uses: r-lib/actions/check-r-package@v2

  tarball:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build vendored source tarball
        # knitr/rmarkdown + pandoc: R CMD build renders the vignettes
        run: |
          cargo update --manifest-path src/rust/Cargo.toml
          Rscript -e 'install.packages(c("rextendr", "knitr", "rmarkdown"))'
          Rscript -e 'rextendr::vendor_crates(".")'
          R CMD build .
      - uses: softprops/action-gh-release@v3
        with:
          files: rpic_*.tar.gz
