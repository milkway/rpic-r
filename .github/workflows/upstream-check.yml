name: upstream version check

# Opens an issue when a newer rpic-core is published to crates.io than the
# version this package pins, so the R bindings can be bumped + re-vendored.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned rpic-core against crates.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pinned=$(grep -E '^[[:space:]]*rpic-core[[:space:]]*=' src/rust/Cargo.toml \
            | sed -E 's/.*"([0-9][^"]*)".*/\1/' | head -1)
          latest=$(curl -fsSL -H "User-Agent: rpic-r upstream check (leite@castlab.org)" \
            https://crates.io/api/v1/crates/rpic-core \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['crate']['max_stable_version'])")
          echo "pinned=$pinned  latest=$latest"

          if ! printf '%s' "$latest" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected crates.io version '$latest'"; exit 1
          fi
          if [ "$pinned" = "$latest" ]; then
            echo "Already pinned to the latest ($latest)."; exit 0
          fi
          newest=$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)
          if [ "$newest" != "$latest" ]; then
            echo "Pinned ($pinned) is newer than crates.io ($latest); nothing to do."; exit 0
          fi

          title="Bump rpic-core/rpic-render to v$latest (crates.io)"
          if gh issue list --state open --search "in:title $title" --json title \
               --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue already open: $title"; exit 0
          fi

          gh label create dependencies --color 0366d6 \
            --description "Upstream dependency updates" 2>/dev/null || true

          # NOTE: no heredoc here — a column-0 heredoc body terminates the
          # YAML block scalar and invalidates the whole workflow file (this
          # exact workflow was broken from birth that way; every push showed
          # a jobless "workflow file issue" failure).
          {
            echo "\`rpic-core\` **v$latest** is on crates.io; this package still pins **v$pinned**."
            echo
            echo "### Bump checklist"
            echo "- [ ] \`DESCRIPTION\`: bump \`Version\` (match the upstream release, e.g. \`$latest\`)"
            echo "- [ ] \`src/rust/Cargo.toml\`: set \`version\`, \`rpic-core = \"$latest\"\`, \`rpic-render = \"$latest\"\`"
            echo "- [ ] Re-vendor: \`rextendr::vendor_crates(\".\")\` (refreshes \`Cargo.lock\`, \`vendor.tar.xz\`, \`vendor-config.toml\`)"
            echo "- [ ] Shim still compiles: \`cargo check --manifest-path src/rust/Cargo.toml\` (caret pins pull new cores; additive struct fields broke it once)"
            echo "- [ ] \`R CMD check\` / let CI go green"
            echo "- [ ] Tag + release \`v$latest\` on this repo"
            echo
            echo "Upstream: https://github.com/milkway/rpic-lang/releases"
            echo
            echo "_Opened automatically by \`.github/workflows/upstream-check.yml\`._"
          } > /tmp/issue-body.md
          gh issue create --title "$title" --label dependencies --body-file /tmp/issue-body.md
          echo "Opened issue: $title"
