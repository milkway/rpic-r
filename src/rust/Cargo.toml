[package]
name = 'rpic'
publish = false
version = '0.13.0'
edition = '2024'
rust-version = '1.88'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'rpic'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '*'
rpic-core = "0.17.0"
rpic-render = "0.17.0"
geopic-core = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

[workspace]
